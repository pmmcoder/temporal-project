name: personal-workflow-platform

x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile
  args:
    NODE_IMAGE: node:24.16.0-bookworm-slim
    GO_IMAGE: golang:1.26.0-bookworm
    RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot

x-app-environment: &app-environment
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: personal-workflows
  TEMPORAL_UI_URL: http://127.0.0.1:8233
  LOG_LEVEL: ${LOG_LEVEL:-info}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_APPROVER_OPEN_IDS: ${FEISHU_APPROVER_OPEN_IDS:-}
  FEISHU_DEFAULT_CHAT_ID: ${FEISHU_DEFAULT_CHAT_ID:-}

services:
  postgresql:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-db-bootstrap:
    image: postgres:16.10-bookworm
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGHOST: postgresql
      PGUSER: temporal
      PGPASSWORD: ${POSTGRES_PASSWORD:-temporal}
    command:
      - sh
      - -c
      - |
        set -eu
        for db in temporal temporal_visibility; do
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1; then
            createdb "$$db"
          fi
        done

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      temporal-db-bootstrap:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
    expose:
      - "7233"

  temporal-bootstrap:
    build: *app-build
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      temporal:
        condition: service_started
    environment: *app-environment

  temporal-ui:
    image: temporalio/ui:2.56.4
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8233
    ports:
      - "127.0.0.1:8233:8080"

  app-api:
    build: *app-build
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      temporal-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      HTTP_ADDR: ":8080"
      HTTP_ALLOWED_HOSTS: 127.0.0.1:8080,localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/platform", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 10

  app-worker:
    build: *app-build
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      temporal-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      WORKER_HEALTH_ADDR: ":8081"
    healthcheck:
      test: ["CMD", "/platform", "healthcheck-worker"]
      interval: 10s
      timeout: 4s
      retries: 10

volumes:
  pgdata:
